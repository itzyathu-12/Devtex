[workspace]
resolver = "2"
members = ["crates/devtex-core", "crates/devtex-cli", "devtex-desktop/src-tauri", "Devtex-IDE/src-tauri"]
[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["DEVTEX Contributors"]
repository = "https://github.com/itzyathu-12/Devtex"
[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
devtex-core = { path = "crates/devtex-core" }
