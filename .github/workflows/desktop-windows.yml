name: DEVTEX Desktop - Windows verification

on:
  push:
    branches: [main]
    paths:
      - "devtex-desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: devtex-desktop
    # Public client configuration is injected at build time; never store private
    # service-role keys or OAuth client secrets in these variables.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devtex-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate public build configuration
        shell: pwsh
        run: |
          $required = @('VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY', 'GITHUB_OAUTH_CLIENT_ID')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing GitHub Actions repository Variables: " + ($missing -join ', ') + ". Add them in Settings > Secrets and variables > Actions > Variables.")
          }

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: devtex-desktop-windows-installer
          path: devtex-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
