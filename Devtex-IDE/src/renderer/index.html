<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVTEX IDE</title><link rel="stylesheet" href="./style.css"></head><body><header><b class="logo">DEVTEX <small>IDE</small></b><span id="projectName">No workspace</span><nav><button id="openProject">Open folder</button><button id="newFile">+ File</button><button id="save">Save</button><button id="settings">Preferences</button></nav></header><div id="layout"><aside id="explorer"><div class="heading">EXPLORER <button id="collapseAll">Collapse all</button></div><input id="filter" placeholder="Filter loaded files…"><div id="tree">Open a folder to begin.</div><div class="bottom"><button id="addFile">+ File</button><button id="addFolder">+ Folder</button></div></aside><main><div class="tab"><span id="activeTab">Welcome</span><span id="dirtyMark"></span><button id="toggleOutput">Output</button></div><section class="edit"><pre id="gutter">1</pre><textarea id="editor" spellcheck="false" placeholder="Open a file…"></textarea><div id="welcome"><div class="mark">D.</div><h1>Make space for the work.</h1><p>A quiet workspace. Your project, your flow.</p><button id="welcomeOpen">Open folder</button></div></section><section id="outputPanel"><div class="heading">OUTPUT <button id="clearOutput">Clear</button><button id="closeOutput">Hide</button></div><pre id="output">DEVTEX local session ready.</pre></section></main><aside id="notes"><div class="heading">PROJECT NOTES <button id="hideIntent">Hide</button></div><label>INTENTION</label><textarea id="intentText" placeholder="What are you building?"></textarea><button id="saveIntent">Save note</button><p id="intentStatus">Stored locally</p><hr><label>SESSION</label><p>Workspace <b id="statusProject">—</b></p><p>File <b id="statusFile">—</b></p><p>Storage <b>Local</b></p></aside></div><footer><span>● LOCAL</span><span id="footerFile">No file</span><button id="showExplorer">Explorer</button><button id="showIntent">Notes</button></footer><div id="preferences" class="hidden"><section><div class="heading">PREFERENCES <button id="closeSettings">×</button></div><label>Theme <select id="theme"><option value="black">Pure black</option><option value="graphite">Graphite</option></select></label><label>Layout <select id="layoutMode"><option value="minimal">Minimal</option><option value="comfortable">Comfortable</option></select></label><label>Editor font size <input id="fontSize" type="range" min="11" max="24" value="14"></label><label><input id="prefExplorer" type="checkbox" checked> Explorer visible</label><label><input id="prefIntent" type="checkbox" checked> Notes visible</label><label><input id="prefOutput" type="checkbox" checked> Output visible</label><label><input id="prefLines" type="checkbox" checked> Line numbers</label><button id="resetSettings">Reset</button></section></div><script type="module" src="./src.ts"></script></body></html>
